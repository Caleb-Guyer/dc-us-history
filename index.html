<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#09171e"><meta name="description" content="DC US History: The Last Dispatch. A voiced Chapter 5 story campaign through Boston's road to revolution, with Chapter 4 also playable."><title>DC US History — The Last Dispatch</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="c5.css?v=3.2"><script type="module" src="c5.mjs?v=3.2"></script></head>
<body>
 <div id="cover" aria-hidden="true"></div>
 <canvas id="scene3d" class="game-canvas" tabindex="0" aria-label="First-person game. WASD move, mouse or arrow keys look, E interact, F fire or distract, Shift sprint, C crouch, Space jump, P pause."></canvas>
 <canvas id="scene2d" class="game-canvas" tabindex="0" aria-label="Action game. WASD or arrows move. Hold E at workshop stations, Space dash. In the boat, Shift rows fast and C conceals your wake."></canvas>
 <audio id="dialogue-audio" preload="none" playsinline hidden></audio>
 <div id="hud" hidden><div class="task"><div id="era" class="era"></div><h2 id="objective"></h2><div id="step" class="step"></div></div><div class="hud-actions"><button id="audio-toggle" aria-label="Toggle all sound">SOUND ON</button><button id="pause" aria-label="Pause game">Ⅱ</button></div><div id="compass" class="compass"></div><div id="crosshair" class="reticle" aria-hidden="true"></div><div id="prompt" class="prompt"></div><div class="vitals"><strong id="health">100</strong><div class="bars"><div class="bar"><i id="health-bar"></i></div><div class="bar stamina"><i id="stamina-bar"></i></div></div></div><div id="loadout" class="loadout"></div><div id="instruction" class="instruction"></div><div id="checkpoint" class="checkpoint">CHECKPOINT SAVED</div><div id="term-toast" class="term-toast"></div><div id="damage" class="damage"></div></div>
 <div id="cinema" hidden><div class="letterbox top"></div><div class="letterbox bottom"></div><div class="film-label"><p id="film-year" class="year"></p><h2 id="film-title"></h2></div><div id="film-progress" class="film-progress"></div><div class="film-controls"><button data-action="next-line">Next line · Space</button><button data-action="skip-scene">Skip scene →</button><button data-action="pause-cut" aria-label="Pause scene">Ⅱ</button></div></div>
 <div id="subtitle" class="subtitle" role="status"></div>
 <div id="touch"><div class="touch-pad"><button data-key="KeyW" aria-label="Move forward">↑</button><button data-key="KeyA" aria-label="Move left">←</button><button data-key="KeyS" aria-label="Move backward">↓</button><button data-key="KeyD" aria-label="Move right">→</button></div><div class="touch-actions"><button data-key="KeyE" aria-label="Interact">USE</button><button data-key="KeyF" aria-label="Fire or distract">ACT</button><button data-key="ShiftLeft" aria-label="Sprint or row fast">RUN</button><button data-key="KeyC" aria-label="Crouch or conceal">LOW</button><button data-key="Space" aria-label="Jump or dash">JUMP</button><button data-key="ArrowLeft" aria-label="Look left">↶</button></div></div>
 <main id="ui"></main><noscript>This game needs JavaScript enabled.</noscript>
</body></html>
